#@ load("@ytt:overlay", "overlay")
#@ load("helpers.lib.yaml", "system_deployment")

#! Observation only: collect connection, TLS, endpoint-health and request-queue
#! counters on the components involved in activation/stat forwarding. This does
#! not change routing, mTLS, timeouts, resources, or inject faults.
#@overlay/match by=overlay.or_op(system_deployment("autoscaler"), system_deployment("activator")), expects=2
---
spec:
  template:
    metadata:
      #@overlay/match missing_ok=True
      annotations:
        #@overlay/match missing_ok=True
        proxy.istio.io/config: |
          proxyStatsMatcher:
            inclusionRegexps:
            - ".*autoscaler.*"
            - ".*upstream_cx_(connect_fail|connect_timeout|active|destroy).*"
            - ".*upstream_rq_(pending|active|timeout|.*reset).*"
            - ".*membership_(healthy|total).*"
            - ".*ssl.*"
            - ".*(cds|lds|rds|eds)\\..*"
